# Declarative configuration used by the integration tests for OTEL_CONFIG_FILE. The collector base URL is provided via
# environment variable substitution, to also verify that substitution works. Export intervals are short to speed up
# tests; under a configuration file, the OTEL_BSP_*/OTEL_BLRP_*/OTEL_METRIC_* environment variables do not apply.
file_format: '1.0'
resource:
  attributes:
    - name: service.name
      value: declarative-config-test
tracer_provider:
  processors:
    - batch:
        schedule_delay: 20
        exporter:
          otlp_http:
            endpoint: ${TEST_COLLECTOR_BASE_URL}/v1/traces
meter_provider:
  readers:
    - periodic:
        interval: 100
        timeout: 90
        exporter:
          otlp_http:
            endpoint: ${TEST_COLLECTOR_BASE_URL}/v1/metrics
logger_provider:
  processors:
    - batch:
        schedule_delay: 20
        exporter:
          otlp_http:
            endpoint: ${TEST_COLLECTOR_BASE_URL}/v1/logs
