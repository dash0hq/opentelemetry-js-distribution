version: 2
updates:
  - package-ecosystem: "npm"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "07:00"
      timezone: "Europe/Berlin"
    ignore:
      - dependency-name: "chai"
      - dependency-name: "node-fetch"
        versions:
        - ">=3.0.0"
      - dependency-name: "typescript"
        versions:
          - ">=6.0.0"
      - dependency-name: "mocha"
        versions:
          - ">=12.0.0"
    groups:
      # The OpenTelemetry packages of the 2.x line are updated together in one pull request, so that they move as a
      # matched set, and the tests run against the combination that gets released. This matters in particular for
      # @opentelemetry/sdk-node, which is pinned to an exact version because src/2.x/declarativeResourceDetectors.ts
      # patches its internals. The -1.x aliases are pinned to the last 1.x-compatible releases and stay excluded.
      # Groups are matched in order, so this one needs to come before production-dependencies.
      opentelemetry:
        patterns:
          - "@opentelemetry/*"
        exclude-patterns:
          - "@opentelemetry/*-1.x"
      production-dependencies:
        dependency-type: "production"
      development-dependencies:
        dependency-type: "development"
    commit-message:
      # Make Dependabot use the prefix "fix" when updating production dependencies. This makes
      # semantic-release/commit-analyzer create a new release when production dependencies have been updated on main.
      prefix: "fix"
      prefix-development: "chore"
      include: "scope"

  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "07:00"
      timezone: "Europe/Berlin"

